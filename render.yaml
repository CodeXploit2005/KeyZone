# Render Free + external Turso Free database. No persistent disk required.
services:
  - type: web
    name: keyzone-portal
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: HOST
        value: 0.0.0.0
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: KEYZONE_SITE_DIR
        value: ./release-site/dist
      - key: KEYZONE_ADMIN_PASSWORD
        sync: false
